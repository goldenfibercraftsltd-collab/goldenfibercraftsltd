<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Cinzel:wght@700&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
        font-weight: 700;
        font-size: 43px;
        letter-spacing: 4px;
        fill: #15803d;
      }
      .brand-sub {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 6px;
        fill: #15803d;
      }
    </style>
  </defs>

  <!-- GF Emblem / Leaf Icon -->
  <g transform="translate(15, 10)">
    <!-- Outer G Contour (Forest Green) -->
    <path d="M 230 115 C 205 75, 160 62, 115 88 C 65 118, 52 188, 70 248 C 88 308, 145 355, 205 352 C 242 350, 275 328, 292 295 L 235 295 C 220 310, 195 318, 172 312 C 132 302, 108 262, 102 225 C 96 182, 112 135, 148 118 C 172 106, 202 110, 218 128 L 248 102 C 242 96, 235 90, 228 85 Z" fill="#15803d" />
    
    <!-- G Inner Horizontal Crossbar -->
    <path d="M 165 240 L 215 240 L 215 268 L 165 268 Z" fill="#15803d" />

    <!-- Main Leaf & F Stem (Vibrant Green) -->
    <path d="M 232 352 C 225 295, 240 215, 282 145 C 322 78, 388 32, 442 20 C 432 90, 408 172, 335 242 C 288 288, 248 335, 232 352 Z" fill="#16a34a" />
    
    <!-- Leaf Inner White Void / Slit -->
    <path d="M 295 188 C 348 128, 402 65, 422 42 C 390 98, 325 188, 275 248 C 270 230, 280 205, 295 188 Z" fill="#ffffff" />

    <!-- F Crossbar Branch (Forest Green) -->
    <path d="M 252 262 C 295 262, 348 240, 380 216 C 348 248, 295 280, 242 284 Z" fill="#15803d" />
  </g>

  <!-- Typography -->
  <!-- "GOLDEN FIBER" -->
  <text x="250" y="415" text-anchor="middle" class="brand-title">GOLDEN FIBER</text>
  
  <!-- "— CRAFTS LTD. —" with clean flanking rules -->
  <line x1="45" y1="446" x2="135" y2="446" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />
  <text x="250" y="454" text-anchor="middle" class="brand-sub">CRAFTS LTD.</text>
  <line x1="365" y1="446" x2="455" y2="446" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />
</svg>
